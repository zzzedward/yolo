# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

# Ultralytics YOLOv5 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov5
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov5n.yaml' will call yolov5.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  l: [1.00, 1.00, 1024]
  x: [1.33, 1.25, 1024]

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  - [-1, 1, Focus, [64, 3]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C3, [128]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 9, C3, [256]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 9, C3, [512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 1, SPP, [1024, [5, 9, 13]]]
  - [-1, 3, C3, [1024, False]] # 9

  - [-1, 1, Focus, [64, 3]] # 10-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 11-P2/4
  - [-1, 3, C3, [128]]
  - [-1, 1, Conv, [256, 3, 2]] # 13-P3/8
  - [-1, 9, C3, [256]]
  - [-1, 1, Conv, [512, 3, 2]] # 15-P4/16
  - [-1, 9, C3, [512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 17-P5/32
  - [-1, 1, SPP, [1024, [5, 9, 13]]]
  - [-1, 3, C3, [1024, False]] # 19

  - [[4, 14], 1, ADD, []] # 20 two stream fuse
  - [[6, 16], 1, ADD, []] # 21 two stream fuse
  - [[9, 19], 1, ADD, []] # 22 two stream fuse

# YOLOv5 head
head:
  - [-1, 1, Conv, [512, 1, 1]] # 23
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 24
  - [[24, 21], 1, Concat, [1]] # 25 cat backbone P4
  - [-1, 3, C3, [512, False]] # 26

  - [-1, 1, Conv, [256, 1, 1]] # 27
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 28
  - [[28, 20], 1, Concat, [1]] # 29 cat backbone P3
  - [-1, 3, C3, [256, False]] # 30 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 31
  - [[31, 27], 1, Concat, [1]] # 32 cat head P4
  - [-1, 3, C3, [512, False]] # 33 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 34
  - [[34, 23], 1, Concat, [1]] # 35 cat head P5
  - [-1, 3, C3, [1024, False]] # 36 (P5/32-large)

  - [[30, 33, 36], 1, Detect, [nc]] # Detect(P3, P4, P5)

ch: 6 # input channels
