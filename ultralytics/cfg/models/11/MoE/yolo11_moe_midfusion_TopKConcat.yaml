# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  # RGB
  - [-1, 2, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]

  # 辅助分支
  - [-1, 2, Conv, [64, 3, 2]] # 9-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 10-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]

  - [-1, 2, Conv, [64, 3, 2]] # 12-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 13-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]

  - [-1, 2, Conv, [64, 3, 2]] # 15-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 16-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]

  - [-1, 2, Conv, [64, 3, 2]] # 18-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 19-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]

  - [-1, 2, Conv, [64, 3, 2]] # 21-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 22-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  

  #MoE
  - [[11, 14, 17, 20, 23], 1, Concat, [1]] #24
  - [-1, 1, VMoETopKRouter, [5]] #25

  - [[25, 11, 14, 17, 20, 23], 1, ChannelConcat, []]  #26
  - [-1, 1, Conv, [256, 3, 2]] # 27
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 29
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 31
  - [-1, 2, C3k2, [1024, True]]

  - [[4, 28], 1, ADD, []]  # ADD backbone P3   33
  - [[6, 30], 1, ADD, []]  # ADD backbone P4   34
  - [[8, 32], 1, ADD, []]  # ADD backbone P5   35

  - [-1, 1, SPPF, [1024, 5]] # 36
  - [-1, 2, C2PSA, [1024]] # 37

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[38, 34], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 40

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[41, 33], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 43 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[44, 40], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 46 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[47, 37], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 49 (P5/32-large)

  - [[43, 46, 49], 1, Detect, [nc]] # Detect(P3, P4, P5)

ch: [3, 1, 1, 1, 1, 1]  # input channels